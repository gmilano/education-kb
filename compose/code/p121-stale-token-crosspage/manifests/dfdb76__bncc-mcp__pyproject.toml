[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bncc-mcp"
version = "0.2.1"
description = "Servidor MCP da BNCC: habilidades com unidade temática, objeto de conhecimento, o Mapa de Foco (Instituto Reúna) e o complemento de Computação."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Daniel" }]
keywords = ["bncc", "mcp", "educacao", "curriculo", "brasil", "mapa-de-foco", "computacao"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/dfdb76/bncc-mcp"
Repository = "https://github.com/dfdb76/bncc-mcp"

[project.scripts]
bncc-mcp = "bncc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["bncc_mcp"]
artifacts = ["bncc_mcp/data/*.csv"]
