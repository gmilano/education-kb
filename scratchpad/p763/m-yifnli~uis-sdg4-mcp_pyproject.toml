[project]
name = "uis-sdg4-mcp"
version = "0.1.0"
description = "MCP server for querying UIS published SDG4 education indicator data via natural language"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "UNESCO Institute for Statistics" }
]
keywords = ["unesco", "uis", "sdg4", "education", "mcp", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.0.0",
  "requests>=2.31.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
uis-sdg4-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "codebooks"]

[tool.pytest.ini_options]
markers = [
  "api: marks tests that require a live UIS API connection (deselect with -m 'not api')",
]
asyncio_mode = "auto"
